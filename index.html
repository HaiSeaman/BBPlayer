<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' file: blob:; img-src 'self' file: data: blob:;">
  <title>BBPlayer</title>
  <style>
    :root {
      --bg-obsidian: #08090c;
      --panel-border: rgba(255, 255, 255, 0.08);
      --panel-border-glow: rgba(0, 242, 254, 0.25);
      --accent-neon: #00f2fe;
      /* 强调文字色：深色主题用亮青，浅色主题用深青蓝，保证对比度（青色纯色在浅底上不可读） */
      --accent-text: #00f2fe;
      --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      /* 播放键唯一实心强调（点元素纯色，渐变只留给进度条） */
      --accent-solid: #00f2fe;
      --accent-on-solid: #051019;
      --accent-tint: rgba(0, 242, 254, 0.1);
      /* 统一圆角刻度（四档） */
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-full: 999px;
      /* 实心抬升面：替代毛玻璃 backdrop-filter（省 GPU 模糊开销），近实底保证可读性 */
      --surface-raised: rgba(17, 20, 27, 0.96);
      /* 幽灵按钮悬停底色 */
      --ctrl-hover-bg: rgba(255, 255, 255, 0.08);
      /* 功能栏毛玻璃半透明底色（用户指定保留的视觉效果，仅此一处 backdrop-filter） */
      --dock-glass: rgba(14, 17, 23, 0.72);
      --cover-ring: rgba(255, 255, 255, 0.07);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      /* —— 外观主题高级变量（深色为默认值，data-theme="light" 时整体覆盖为浅色系） —— */
      --titlebar-shadow: 0 1px 6px rgba(0, 0, 0, 0.8), 0 1px 2px rgba(0, 0, 0, 0.6);
      --ghost-bg: rgba(255, 255, 255, 0.06);
      --ghost-hover: rgba(255, 255, 255, 0.12);
      --ghost-hover-border: rgba(255, 255, 255, 0.2);
      --logo-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      --empty-logo-fill: rgba(255, 255, 255, 0.05);
      --empty-logo-stroke: rgba(255, 255, 255, 0.2);
      --subtitle-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      --music-title-shadow: 0 2px 16px rgba(0, 0, 0, 0.72);
      --bar-border: rgba(255, 255, 255, 0.2);
      --shadow-bar: 0 20px 50px rgba(0, 0, 0, 0.65);
      --track-bg: rgba(255, 255, 255, 0.12);
      --handle-bg: #ffffff;
      --menu-hover: rgba(255, 255, 255, 0.08);
      --tooltip-text: #ffffff;
      --subtitle-bg: rgba(8, 9, 12, 0.82);
      --subtitle-text: #ffffff;
      --item-hover: rgba(255, 255, 255, 0.05);
      --win-hover: rgba(255, 255, 255, 0.08);
      --win-hover-border: rgba(255, 255, 255, 0.12);
      --shadow-drawer: -10px 0 30px rgba(0, 0, 0, 0.6);
      --shadow-toast: 0 10px 30px rgba(0, 0, 0, 0.6);
      --shadow-cover: 0 26px 70px rgba(0, 0, 0, 0.55);
      --music-bg: radial-gradient(ellipse 130% 95% at 50% 22%, #151f38 0%, #0b1322 58%, #060a13 100%);
      --music-title: #edf3ff;
      --music-meta: rgba(198, 214, 240, 0.52);
      --cover-frame: rgba(255, 255, 255, 0.045);
      --cover-fallback: rgba(255, 255, 255, 0.5);
      --logo-bg: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
    }

    /* 浅色外观：品牌青蓝渐变保留，中性色反转（浅底深字，确保文字与控件清晰） */
    :root[data-theme='light'] {
      --bg-obsidian: #eef2f7;
      --panel-border: rgba(20, 45, 80, 0.14);
      --panel-border-glow: rgba(0, 130, 235, 0.35);
      --accent-text: #0284c7;
      --accent-solid: #0284c7;
      --accent-on-solid: #ffffff;
      --accent-tint: rgba(2, 132, 199, 0.1);
      --surface-raised: rgba(255, 255, 255, 0.97);
      --ctrl-hover-bg: rgba(15, 23, 36, 0.07);
      --dock-glass: rgba(255, 255, 255, 0.72);
      --cover-ring: rgba(20, 45, 80, 0.12);
      --text-primary: #101828;
      --text-secondary: #475467;
      --text-muted: #98a2b3;
      --titlebar-shadow: 0 1px 6px rgba(255, 255, 255, 0.78), 0 1px 2px rgba(255, 255, 255, 0.6);
      --ghost-bg: rgba(255, 255, 255, 0.8);
      --ghost-hover: rgba(20, 45, 80, 0.1);
      --ghost-hover-border: rgba(20, 45, 80, 0.25);
      --logo-shadow: 0 20px 40px rgba(30, 60, 100, 0.16);
      --empty-logo-fill: rgba(20, 45, 80, 0.06);
      --empty-logo-stroke: rgba(20, 45, 80, 0.35);
      --subtitle-shadow: 0 2px 8px rgba(4, 12, 24, 0.18);
      --music-title-shadow: 0 2px 16px rgba(4, 12, 24, 0.16);
      --bar-border: rgba(20, 45, 80, 0.18);
      --shadow-bar: 0 16px 40px rgba(30, 60, 100, 0.18);
      --track-bg: rgba(20, 45, 80, 0.14);
      --handle-bg: #14507a;
      --menu-hover: rgba(20, 45, 80, 0.07);
      --tooltip-text: #101828;
      --subtitle-bg: rgba(255, 255, 255, 0.88);
      --subtitle-text: #101828;
      --item-hover: rgba(20, 45, 80, 0.06);
      --win-hover: rgba(20, 45, 80, 0.08);
      --win-hover-border: rgba(20, 45, 80, 0.2);
      --shadow-drawer: -10px 0 24px rgba(30, 60, 100, 0.16);
      --shadow-toast: 0 10px 26px rgba(30, 60, 100, 0.18);
      --shadow-cover: 0 26px 70px rgba(30, 60, 100, 0.28);
      --music-bg: radial-gradient(ellipse 130% 95% at 50% 22%, #dfe9f6 0%, #eef2f7 58%, #f6f8fb 100%);
      --music-title: #101828;
      --music-meta: rgba(71, 84, 103, 0.72);
      --cover-frame: rgba(255, 255, 255, 0.6);
      --cover-fallback: rgba(16, 24, 40, 0.4);
      --logo-bg: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.4) 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-obsidian);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--text-primary);
    }

    #player-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-obsidian);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    #player-container.drag-over::after {
      content: '';
      position: absolute;
      inset: 8px;
      border: 2px dashed var(--accent-neon);
      border-radius: var(--r-lg);
      pointer-events: none;
      z-index: 50;
    }

    /* 顶部轻提示 Toast */
    #global-toast {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-raised);
      color: var(--text-primary);
      padding: 8px 20px;
      border-radius: var(--r-full);
      font-size: 13px;
      font-weight: 500;
      z-index: 40;
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow-toast);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #global-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(4px);
    }

    /* 视频播放核心 - 支持比例拉伸与无边框贴合 */
    #main-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000;
    }

    /* 纯音频音乐播放效果层 - 盖住无画面的 video，位于字幕层(15)之下、控制栏(20)之下。
     设计：封面主色环境光（每首歌背景随封面变化），居中垂直排版，频谱沉底。 */
    #music-visualizer {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none; /* JS 在音乐模式下切换为 flex */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--music-bg);
      overflow: hidden;
      pointer-events: none;
      transition: background 0.7s ease;
    }

    /* 封面卡片：大圆角 + 环境光晕（色值由 JS 从封面采样写入 --cover-glow） */
    .music-cover-frame {
      width: min(34vh, 280px);
      height: min(34vh, 280px);
      border-radius: 22px;
      box-shadow:
        0 26px 70px var(--shadow-cover),
        0 0 90px var(--cover-glow, rgba(64, 128, 255, 0.2)),
        0 0 0 1px var(--cover-ring);
      background: var(--cover-frame);
      overflow: hidden;
      flex-shrink: 0;
    }

    #music-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; /* 找到封面时 JS 置 block */
    }

    #music-cover-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.14), rgba(79, 172, 254, 0.14));
      color: var(--cover-fallback);
    }
    #music-cover-fallback svg {
      width: 92px;
      height: 92px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #music-title {
      max-width: 82%;
      margin: 28px 0 0;
      font-size: clamp(20px, 3.2vh, 30px);
      font-weight: 650;
      letter-spacing: 0.5px;
      color: var(--music-title);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: var(--music-title-shadow);
    }

    /* 元信息行：格式 · 时长（由 JS 填充） */
    .music-meta {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.6px;
      color: var(--music-meta);
      text-transform: uppercase;
    }

    /* 频谱沉底横贯，细柱克制 */
    #music-spectrum {
      position: absolute;
      bottom: 7%;
      left: 50%;
      transform: translateX(-50%);
      width: min(64%, 720px);
      height: 64px;
      opacity: 0.92;
    }

    /* 外挂字幕显示区（bottom 为静态值，无位移逻辑，不需要过渡动画） */
    #custom-subtitle-overlay {
      position: absolute;
      bottom: 90px;
      left: 5%;
      width: 90%;
      text-align: center;
      pointer-events: none;
      z-index: 15;
    }

    #custom-subtitle-text {
      display: inline-block;
      background: var(--subtitle-bg);
      color: var(--subtitle-text);
      padding: 8px 20px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.4;
      text-shadow: var(--subtitle-shadow);
      word-wrap: break-word;
      white-space: pre-line;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.1);
    }

    /* 空状态 - 黑曜石晶质感视觉 */
    #empty-state {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      color: var(--text-secondary);
      pointer-events: auto;
      text-align: center;
      padding: 40px;
      -webkit-app-region: drag;
    }

    #empty-state .empty-actions {
      -webkit-app-region: no-drag;
    }

    #empty-state .brand-logo-container .logo-blob {
      fill: var(--empty-logo-fill);
      stroke: var(--empty-logo-stroke);
    }

    #empty-state .brand-logo-container {
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--logo-bg);
      border: 1px solid var(--panel-border);
      border-radius: 26px;
      box-shadow: var(--logo-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
    }

    #empty-state:hover .brand-logo-container {
      transform: translateY(-4px);
      border-color: var(--panel-border-glow);
    }

    #empty-state h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    #empty-state p {
      font-size: 14px;
      margin-bottom: 28px;
      color: var(--text-secondary);
    }

    .empty-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #040810;
      border: none;
      padding: 11px 26px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: var(--ghost-bg);
      color: var(--text-primary);
      border: 1px solid var(--panel-border);
      padding: 11px 26px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn-ghost:hover {
      background: var(--ghost-hover);
      border-color: var(--ghost-hover-border);
      transform: translateY(-1px);
    }

    /* 自定义沉浸式无边框标题栏（全透明通栏：无毛玻璃底色，仅文字与按键；清晰度由字影/图标投影保障）。
       颜色对齐契约：文字/按键/悬停/投影全部取自主题变量（--text-*、--win-*、--titlebar-*），
       与底部功能栏共用同一套深浅色板——切换主题时顶部随之同步变色，不允许出现写死的主题色 */
    #titlebar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 42px;
      background: transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px 0 18px;
      z-index: 20;
      /* 不使用 OS 级拖拽区：app-region:drag 会吞掉鼠标事件（悬停/停放时热区唤出与
         保持显示失效）；窗口拖拽由 renderer.js 用 pointer 事件自行实现，事件全程可达 */
      -webkit-app-region: no-drag;
      transition: opacity 0.12s ease-out; /* 近瞬时过渡：跟随鼠标弹出/收起，无"慢半拍"感 */
      opacity: 1;
    }

    #titlebar.hide {
      opacity: 0;
      pointer-events: none;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 65%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: var(--titlebar-shadow); /* 透明底上保证文字在任意画面背景下可读 */
    }

    .title-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: var(--text-primary);
    }

    .title-logo svg {
      width: 16px;
      height: 16px;
    }

    #video-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-primary);
      font-weight: 400;
      opacity: 0.85;
    }

    /* 窗口控制按钮组：贴住窗口右上角的原生式按键（非悬浮）。
       44×42 矩形热区一直延伸到窗口边缘，视觉上属于窗口框架本身 */
    .window-controls {
      display: flex;
      height: 42px;
      margin-right: -14px; /* 抵消标题栏右侧内边距，按键贴住窗口角 */
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 44px;
      height: 42px;
      border-radius: 0;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .win-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .win-btn:hover {
      background: var(--win-hover);
      color: var(--text-primary);
    }

    .win-btn.close:hover {
      background: #e81123;
      color: #ffffff;
    }

    /* 现代无边框悬浮胶囊控制面板 (Floating Glass Dock) */
    #controls-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 900px;
      padding: 12px 18px;
      background: var(--dock-glass);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--bar-border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-bar);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-app-region: no-drag;
    }

    #controls-overlay.hide {
      opacity: 0;
      transform: translate(-50%, 16px);
      pointer-events: none;
    }

    /* 精准极细悬浮进度条 */
    #progress-container {
      position: relative;
      width: 100%;
      height: 4px;
      background: var(--track-bg);
      border-radius: 2px;
      cursor: pointer;
      transition: height 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #progress-container:hover {
      height: 8px;
      border-radius: 4px;
    }

    #progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      border-radius: 4px;
      transition: width 0.05s linear;
    }

    #progress-handle {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      background: var(--handle-bg);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #progress-container:hover #progress-handle {
      opacity: 1;
      transform: translateY(-50%) scale(1.1);
    }

    /* 时间 Hover 气泡提示 */
    #progress-tooltip {
      position: absolute;
      bottom: 18px;
      transform: translateX(-50%);
      background: var(--surface-raised);
      color: var(--tooltip-text);
      padding: 4px 10px;
      border-radius: var(--r-sm);
      font-size: 11px;
      font-weight: 500;
      display: none;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid var(--panel-border);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    /* 播放功能栏按钮组 */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 职能分组细分隔线：画面设置 · 音量 · 工具 · 视图 */
    .ctrl-divider {
      width: 1px;
      height: 18px;
      background: var(--panel-border);
      margin: 0 6px;
      flex-shrink: 0;
    }

    /* 幽灵按钮：默认纯图标无边框，悬停浮现浅底，激活只染图标色 */
    .ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--r-sm);
      padding: 0;
      transition: color 0.15s ease, background-color 0.15s ease;
      -webkit-app-region: no-drag;
    }

    .ctrl-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ctrl-btn:hover {
      background: var(--ctrl-hover-bg);
      color: var(--text-primary);
    }

    .ctrl-btn.active {
      color: var(--accent-text);
      background: transparent;
    }

    /* 播放键：整个控制栏唯一的实心强调（圆角方形，纯色无渐变无发光） */
    #btn-play {
      width: 40px;
      height: 40px;
      border-radius: var(--r-md);
      background: var(--accent-solid);
      color: var(--accent-on-solid);
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #btn-play:hover {
      background: var(--accent-solid);
      color: var(--accent-on-solid);
      transform: scale(1.05);
    }

    #btn-play:active {
      transform: scale(0.96);
    }

    #btn-play svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      stroke: none;
    }

    /* 文字类型控制按钮（倍速/比例/字幕） */
    .ctrl-btn.text-btn {
      width: auto;
      padding: 0 8px;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .time-display {
      font-size: 12px;
      color: var(--text-primary);
      font-weight: 500;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      margin-left: 4px;
      letter-spacing: 0.5px;
    }

    /* 音量调控弹窗 */
    .volume-container {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-slider-wrapper {
      width: 64px;
      display: flex;
      align-items: center;
    }

    #volume-range {
      width: 100%;
      height: 4px;
      accent-color: var(--accent-neon);
      cursor: pointer;
      border-radius: 2px;
    }

    /* 超额增益警示：音量超过 100%（进入增益放大区）滑块变橙，提醒注意防爆音 */
    #volume-range.boost {
      accent-color: #ff8c00;
    }

    /* 浮动下拉菜单组件 (倍速、字幕、画面比例) */
    .menu-popover-container {
      position: relative;
    }

    .popover-menu {
      position: absolute;
      bottom: 42px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface-raised);
      border: 1px solid var(--panel-border);
      border-radius: var(--r-md);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 30;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      min-width: 110px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .popover-menu.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .menu-item {
      position: relative;
      padding: 7px 14px 7px 30px;
      font-size: 12px;
      color: var(--text-secondary);
      border-radius: var(--r-sm);
      cursor: pointer;
      text-align: left;
      transition: color 0.15s ease, background-color 0.15s ease;
      white-space: nowrap;
    }

    /* 选中态指示点：所有条目占位、仅激活项着色，保证文字左对齐 */
    .menu-item::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 50%;
      width: 5px;
      height: 5px;
      margin-top: -2.5px;
      border-radius: 50%;
      background: transparent;
    }

    .menu-item.active::before {
      background: var(--accent-text);
    }

    .menu-item:hover {
      background: var(--menu-hover);
      color: var(--text-primary);
    }

    .menu-item.active {
      color: var(--accent-text);
      font-weight: 600;
    }

    /* 上次播放记忆续播提示条 */
    #resume-toast {
      position: absolute;
      bottom: 96px;
      left: 28px;
      background: var(--surface-raised);
      border: 1px solid var(--panel-border);
      padding: 10px 18px;
      border-radius: var(--r-full);
      display: none;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      z-index: 25;
      box-shadow: var(--shadow-toast);
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-app-region: no-drag;
    }

    @keyframes slideIn {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .resume-btn {
      color: var(--accent-text);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    .resume-close {
      cursor: pointer;
      opacity: 0.6;
      font-size: 12px;
      transition: opacity 0.2s;
    }
    .resume-close:hover { opacity: 1; }

    /* 右侧抽屉式播放列表面板 */
    #playlist-panel {
      position: absolute;
      top: 42px;
      right: -320px;
      width: 320px;
      height: calc(100vh - 42px);
      background: var(--surface-raised);
      border-left: 1px solid var(--panel-border);
      z-index: 18;
      display: flex;
      flex-direction: column;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-drawer);
    }

    #playlist-panel.open {
      right: 0;
    }

    .playlist-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
    }

    .playlist-header h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .playlist-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .playlist-count {
      font-size: 11px;
      color: var(--accent-text);
      font-weight: 500;
      background: var(--accent-tint);
      padding: 2px 9px;
      border-radius: var(--r-full);
    }

    .ctrl-btn.small {
      width: 26px;
      height: 26px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .ctrl-btn.small svg {
      width: 14px;
      height: 14px;
    }

    .playlist-items {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 calc(100% - 22px), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 calc(100% - 22px), transparent 100%);
    }

    .playlist-item {
      position: relative;
      padding: 9px 10px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      border-radius: var(--r-sm);
      transition: color 0.15s ease, background-color 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
    }

    .playlist-item:hover {
      background: var(--item-hover);
      color: var(--text-primary);
    }

    /* 正在播放：左缘强调条 + 标题着色（替代整行染色） */
    .playlist-item.active {
      background: transparent;
      color: var(--accent-text);
      font-weight: 500;
    }

    .playlist-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 9px;
      bottom: 9px;
      width: 3px;
      border-radius: 2px;
      background: var(--accent-text);
    }

    /* 序号列：等宽两位数；正在播放的条目换成三根跳动小均衡器 */
    .item-index {
      width: 26px;
      flex-shrink: 0;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 序号与均衡器双列共存，由 active 状态切换可见性
      （playPlaylistItem 的轻量高亮路径只改 class 不重建 DOM，两份 DOM 都必须在场） */
    .playlist-item .eq-indicator {
      display: none;
    }

    .playlist-item.active .eq-indicator {
      display: flex;
    }

    .playlist-item.active .item-index {
      display: none;
    }

    .eq-indicator {
      width: 26px;
      height: 14px;
      flex-shrink: 0;
      align-items: flex-end;
      gap: 2.5px;
    }

    .eq-indicator i {
      width: 3px;
      border-radius: 1px;
      background: var(--accent-text);
      transform-origin: bottom;
      animation: eq-bounce 1s ease-in-out infinite;
    }

    .eq-indicator i:nth-child(1) { height: 8px; }
    .eq-indicator i:nth-child(2) { height: 13px; animation-delay: 0.15s; }
    .eq-indicator i:nth-child(3) { height: 10px; animation-delay: 0.3s; }

    /* 暂停时均衡器同步静止（由 JS 切换 is-paused） */
    .playlist-items.is-paused .eq-indicator i {
      animation-play-state: paused;
    }

    @keyframes eq-bounce {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    .playlist-item .item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .playlist-item .item-time {
      margin-left: 8px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
      white-space: nowrap;
    }

    .playlist-item .remove-btn,
    .playlist-item .new-win-btn {
      margin-left: 6px;
      opacity: 0;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .playlist-item .remove-btn svg,
    .playlist-item .new-win-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .playlist-item:hover .remove-btn,
    .playlist-item:hover .new-win-btn {
      opacity: 1;
    }

    .playlist-item .remove-btn:hover {
      color: #ff4d4f;
    }

    .playlist-item .new-win-btn:hover {
      color: var(--accent-text);
    }

    .playlist-empty {
      padding: 60px 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* 键盘可达性：仅键盘导航时显示焦点环 */
    button:focus-visible,
    .menu-item:focus-visible,
    .resume-btn:focus-visible {
      outline: 2px solid var(--accent-text);
      outline-offset: 2px;
    }

    button:focus:not(:focus-visible) {
      outline: none;
    }

    /* 尊重系统"减少动态效果"偏好 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div id="player-container">
    <!-- 无边框自定义标题栏 -->
    <div id="titlebar">
      <div class="title-area">
        <span class="title-logo">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#logoGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="logoGlow" x1="0" y1="0" x2="24" y2="24">
                <stop offset="0%" stop-color="#00f2fe"/>
                <stop offset="100%" stop-color="#4facfe"/>
              </linearGradient>
            </defs>
          </svg>
          BBPLAYER
        </span>
        <span id="video-title">极简本地视频播放器</span>
      </div>
      <!-- 现代极简窗口控制组 -->
      <div class="window-controls">
        <button class="win-btn" id="btn-minimize" title="最小化">
          <svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg>
        </button>
        <button class="win-btn" id="btn-maximize" title="最大化/还原">
          <svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5"/></svg>
        </button>
        <button class="win-btn close" id="btn-close" title="关闭">
          <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
        </button>
      </div>
    </div>

    <!-- 视频渲染 DOM -->
    <video id="main-video"></video>

    <!-- 纯音频音乐播放效果层（频谱可视化 + 封面 + 歌名） -->
    <div id="music-visualizer">
      <div class="music-cover-frame">
        <img id="music-cover-img" alt="专辑封面" />
        <div id="music-cover-fallback">
          <svg viewBox="0 0 24 24">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
      </div>
      <h2 class="music-title" id="music-title">未命名曲目</h2>
      <div class="music-meta" id="music-meta"></div>
      <canvas id="music-spectrum"></canvas>
    </div>

    <!-- 自定义外挂字幕渲染区 -->
    <div id="custom-subtitle-overlay">
      <span id="custom-subtitle-text" style="display: none;"></span>
    </div>

    <!-- 空状态 - 黑曜透镜晶体视觉 -->
    <div id="empty-state">
      <div class="brand-logo-container">
        <svg width="48" height="48" viewBox="0 0 512 512" fill="none">
          <defs>
            <linearGradient id="emptyNeon" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00F2FE"/>
              <stop offset="100%" stop-color="#4FACFE"/>
            </linearGradient>
          </defs>
          <path class="logo-blob" d="M180 140 C180 140, 290 140, 340 190 C380 230, 360 280, 310 300 C370 320, 380 380, 320 420 C270 450, 180 450, 180 450 Z" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="6"/>
          <path d="M210 170 L340 256 L210 342 Z" fill="url(#emptyNeon)"/>
        </svg>
      </div>
      <h2>拖入文件，开始播放</h2>
      <p>支持常见视频与音频格式，自动匹配同名字幕</p>
      <div class="empty-actions">
        <button class="btn-primary" id="btn-open-file">选择文件</button>
        <button class="btn-ghost" id="btn-open-folder">打开文件夹</button>
      </div>
    </div>

    <!-- 上次播放记忆续播提示条 -->
    <div id="resume-toast">
      <span>检测到您上次看到 <b id="resume-time-str">00:00</b></span>
      <span class="resume-btn" id="btn-do-resume">跳转续播</span>
      <span class="resume-close" id="btn-dismiss-resume">✕</span>
    </div>

    <!-- 右侧播放列表抽屉面板 -->
    <div id="playlist-panel">
      <div class="playlist-header">
        <h3>播放列表</h3>
        <div class="playlist-actions">
          <span class="playlist-count" id="playlist-count">0 个视频</span>
          <button class="ctrl-btn small" id="btn-add-folder" title="添加文件夹中的视频">
            <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="ctrl-btn small" id="btn-new-window" title="在新窗口播放当前视频">
            <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </button>
          <button class="ctrl-btn small" id="btn-history-view" title="观看历史记录">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </button>
          <button class="ctrl-btn small" id="btn-playlist-clear" title="清空播放列表">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
      <div class="playlist-items" id="playlist-items">
        <div class="playlist-empty">暂无播放视频<br>拖拽多个视频到此处添加</div>
      </div>
    </div>

    <!-- 顶部消息 Toast -->
    <div id="global-toast"></div>

    <!-- 悬浮胶囊控制面板 (Floating Glass Dock) -->
    <div id="controls-overlay">
      <!-- 时间精准 Seek 进度条 -->
      <div id="progress-container">
        <div id="progress-fill">
          <div id="progress-handle"></div>
        </div>
        <div id="progress-tooltip">00:00</div>
      </div>

      <!-- 控制按键栏 -->
      <div class="controls-row">
        <div class="controls-left">
          <button class="ctrl-btn" id="btn-prev" title="上一个视频">
            <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
          </button>
          <button class="ctrl-btn" id="btn-play" title="播放/暂停 (Space)">
            <svg viewBox="0 0 24 24" id="icon-play-state"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <button class="ctrl-btn" id="btn-next" title="下一个视频">
            <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>
          <div class="time-display">
            <span id="current-time">00:00</span> / <span id="duration-time">00:00</span>
          </div>
        </div>

        <div class="controls-right">
          <!-- 倍速选择菜单 -->
          <div class="menu-popover-container">
            <button class="ctrl-btn text-btn" id="btn-speed" title="倍速播放">1.0x</button>
            <div class="popover-menu" id="speed-menu">
              <div class="menu-item" data-speed="3.0">3.0x</div>
              <div class="menu-item" data-speed="2.0">2.0x</div>
              <div class="menu-item" data-speed="1.5">1.5x</div>
              <div class="menu-item" data-speed="1.25">1.25x</div>
              <div class="menu-item active" data-speed="1.0">1.0x</div>
              <div class="menu-item" data-speed="0.75">0.75x</div>
              <div class="menu-item" data-speed="0.5">0.5x</div>
            </div>
          </div>

          <!-- 画面比例控制 -->
          <div class="menu-popover-container">
            <button class="ctrl-btn text-btn" id="btn-aspect" title="画面比例">自动</button>
            <div class="popover-menu" id="aspect-menu">
              <div class="menu-item active" data-aspect="auto">自动比例</div>
              <div class="menu-item" data-aspect="16-9">16 : 9</div>
              <div class="menu-item" data-aspect="4-3">4 : 3</div>
              <div class="menu-item" data-aspect="cover">拉伸铺满</div>
            </div>
          </div>

          <!-- 外挂字幕控制 -->
          <div class="menu-popover-container">
            <button class="ctrl-btn text-btn" id="btn-subtitle" title="外挂字幕 (CC)">CC</button>
            <div class="popover-menu" id="subtitle-menu">
              <div class="menu-item" id="btn-load-sub">加载字幕文件...</div>
              <div class="menu-item" id="btn-toggle-sub">隐藏字幕</div>
              <div class="menu-item" id="btn-sub-size-up">字号 +</div>
              <div class="menu-item" id="btn-sub-size-down">字号 -</div>
              <div class="menu-item" id="btn-sub-offset-up">字幕延后 0.5s</div>
              <div class="menu-item" id="btn-sub-offset-down">字幕提前 0.5s</div>
            </div>
          </div>

          <span class="ctrl-divider" aria-hidden="true"></span>

          <!-- 音量调控 -->
          <div class="volume-container">
            <button class="ctrl-btn" id="btn-volume" title="音量/静音">
              <svg viewBox="0 0 24 24" id="icon-volume-state"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
            <div class="volume-slider-wrapper">
              <input type="range" id="volume-range" min="0" max="2" step="0.05" value="1" title="音量 0%~200%">
            </div>
          </div>

          <span class="ctrl-divider" aria-hidden="true"></span>

          <!-- 外观主题切换（浅色 / 深色） -->
          <button class="ctrl-btn" id="btn-appearance" title="切换到浅色外观" aria-label="切换外观主题">
            <svg viewBox="0 0 24 24" id="icon-appearance-state">
              <circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.77 1.77M17.33 17.33l1.77 1.77M4.9 19.1l1.77-1.77M17.33 6.67l1.77-1.77"/>
            </svg>
          </button>

          <!-- 播放模式控制菜单 -->
          <div class="menu-popover-container">
            <button class="ctrl-btn" id="btn-play-mode" title="播放模式">
              <svg viewBox="0 0 24 24">
                <g id="icon-playmode-state">
                  <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </g>
              </svg>
            </button>
            <div class="popover-menu" id="play-mode-menu">
              <div class="menu-item" data-mode="list-loop">循环播放</div>
              <div class="menu-item" data-mode="random">随机播放</div>
              <div class="menu-item" data-mode="single-loop">单个循环</div>
            </div>
          </div>

          <!-- 高清截图按键 -->
          <button class="ctrl-btn" id="btn-screenshot" title="画面高清截图 (S)">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </button>

          <!-- 顺时针旋转视频 90° -->
          <button class="ctrl-btn" id="btn-rotate" title="顺时针旋转 90°">
            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>

          <span class="ctrl-divider" aria-hidden="true"></span>

          <!-- 全屏切换 -->
          <button class="ctrl-btn" id="btn-fullscreen" title="全屏 (F11)">
            <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>

          <!-- 播放列表切换按钮 -->
          <button class="ctrl-btn" id="btn-playlist" title="播放列表">
            <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
