  <title>BBPlayer</title>
  <style>
    :root {
      --bg-obsidian: #08090c;
      --panel-border: rgba(255, 255, 255, 0.08);
      --panel-border-glow: rgba(0, 242, 254, 0.25);
      --accent-neon: #00f2fe;
      /* 强调文字色：深色主题用亮青，浅色主题用深青蓝，保证对比度（青色纯色在浅底上不可读） */
      --accent-text: #00f2fe;
      --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      /* 播放键唯一实心强调改用彩虹渐变 --rainbow-gradient，纯色强调变量已移除 */
      --accent-tint: rgba(0, 242, 254, 0.1);
      /* 彩虹渐变色标单一来源（--rw-1..7）：CSS 渐变与三处 SVG 渐变（#rainbowPlay/#logoGlow/#emptyNeon，
         经 .rw-* 类引用）共用同一组值，改品牌色只需改这里 */
      --rw-1: #ff3b4e;
      --rw-2: #ff8a00;
      --rw-3: #ffd400;
      --rw-4: #2ecc5b;
      --rw-5: #00c2ff;
      --rw-6: #2e6bff;
      --rw-7: #a24bff;
      /* 彩虹渐变（品牌主题）：应用图标/播放键/进度条/Logo 共用，横向红→紫 */
      --rainbow-gradient: linear-gradient(90deg, var(--rw-1) 0%, var(--rw-2) 18%, var(--rw-3) 36%, var(--rw-4) 52%, var(--rw-5) 68%, var(--rw-6) 84%, var(--rw-7) 100%);
      /* 统一圆角刻度（四档） */
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-full: 999px;
      /* 实心抬升面：替代毛玻璃 backdrop-filter（省 GPU 模糊开销），近实底保证可读性 */
      --surface-raised: rgba(17, 20, 27, 0.96);
      /* 幽灵按钮悬停底色 */
      --ctrl-hover-bg: rgba(255, 255, 255, 0.08);
      /* 功能栏毛玻璃半透明底色（用户指定保留的视觉效果，仅此一处 backdrop-filter） */
      --dock-glass: rgba(14, 17, 23, 0.72);
      --cover-ring: rgba(255, 255, 255, 0.07);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      /* —— 外观主题高级变量（深色为默认值，data-theme="light" 时整体覆盖为浅色系） —— */
      --titlebar-shadow: 0 1px 6px rgba(0, 0, 0, 0.8), 0 1px 2px rgba(0, 0, 0, 0.6);
      --ghost-bg: rgba(255, 255, 255, 0.06);
      --ghost-hover: rgba(255, 255, 255, 0.12);
      --ghost-hover-border: rgba(255, 255, 255, 0.2);
      --logo-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      --empty-logo-fill: rgba(255, 255, 255, 0.05);
      --empty-logo-stroke: rgba(255, 255, 255, 0.2);
      --subtitle-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      --music-title-shadow: 0 2px 16px rgba(0, 0, 0, 0.72);
      --bar-border: rgba(255, 255, 255, 0.2);
      --shadow-bar: 0 20px 50px rgba(0, 0, 0, 0.65);
      --track-bg: rgba(255, 255, 255, 0.12);
      --handle-bg: #ffffff;
      --menu-hover: rgba(255, 255, 255, 0.08);
      --tooltip-text: #ffffff;
      --subtitle-bg: rgba(8, 9, 12, 0.82);
      --subtitle-text: #ffffff;
      --item-hover: rgba(255, 255, 255, 0.05);
      /* 窗口按键悬停底色：深色调块（深浅两主题下都比背景醒目），图标默认用主文字色 */
      --win-hover: rgba(30, 41, 59, 0.85);
      --shadow-drawer: -10px 0 30px rgba(0, 0, 0, 0.6);
      --shadow-toast: 0 10px 30px rgba(0, 0, 0, 0.6);
      --shadow-cover: 0 26px 70px rgba(0, 0, 0, 0.55);
      --music-bg: radial-gradient(ellipse 130% 95% at 50% 22%, #151f38 0%, #0b1322 58%, #060a13 100%);
      --music-title: #edf3ff;
      --music-meta: rgba(198, 214, 240, 0.52);
      --cover-frame: rgba(255, 255, 255, 0.045);
      --cover-fallback: rgba(255, 255, 255, 0.5);
      --logo-bg: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
    }

    /* 浅色外观：品牌青蓝渐变保留，中性色反转（浅底深字，确保文字与控件清晰） */
    :root[data-theme='light'] {
      --bg-obsidian: #eef2f7;
      --panel-border: rgba(20, 45, 80, 0.14);
      --panel-border-glow: rgba(0, 130, 235, 0.35);
      --accent-text: #0284c7;
      --accent-tint: rgba(2, 132, 199, 0.1);
      --surface-raised: rgba(255, 255, 255, 0.97);
      --ctrl-hover-bg: rgba(15, 23, 36, 0.07);
      --dock-glass: rgba(255, 255, 255, 0.72);
      --cover-ring: rgba(20, 45, 80, 0.12);
      --text-primary: #101828;
      --text-secondary: #475467;
      --text-muted: #98a2b3;
      --titlebar-shadow: 0 1px 6px rgba(255, 255, 255, 0.78), 0 1px 2px rgba(255, 255, 255, 0.6);
      --ghost-bg: rgba(255, 255, 255, 0.8);
      --ghost-hover: rgba(20, 45, 80, 0.1);
      --ghost-hover-border: rgba(20, 45, 80, 0.25);
      --logo-shadow: 0 20px 40px rgba(30, 60, 100, 0.16);
      --empty-logo-fill: rgba(20, 45, 80, 0.06);
      --empty-logo-stroke: rgba(20, 45, 80, 0.35);
      --subtitle-shadow: 0 2px 8px rgba(4, 12, 24, 0.18);
      --music-title-shadow: 0 2px 16px rgba(4, 12, 24, 0.16);
      --bar-border: rgba(20, 45, 80, 0.18);
      --shadow-bar: 0 16px 40px rgba(30, 60, 100, 0.18);
      --track-bg: rgba(20, 45, 80, 0.14);
      --handle-bg: #14507a;
      --menu-hover: rgba(20, 45, 80, 0.07);
      --tooltip-text: #101828;
      --subtitle-bg: rgba(255, 255, 255, 0.88);
      --subtitle-text: #101828;
      --item-hover: rgba(20, 45, 80, 0.06);
      --win-hover: rgba(20, 45, 80, 0.14);
      --shadow-drawer: -10px 0 24px rgba(30, 60, 100, 0.16);
      --shadow-toast: 0 10px 26px rgba(30, 60, 100, 0.18);
      --shadow-cover: 0 26px 70px rgba(30, 60, 100, 0.28);
      --music-bg: radial-gradient(ellipse 130% 95% at 50% 22%, #dfe9f6 0%, #eef2f7 58%, #f6f8fb 100%);
      --music-title: #101828;
      --music-meta: rgba(71, 84, 103, 0.72);
      --cover-frame: rgba(255, 255, 255, 0.6);
      --cover-fallback: rgba(16, 24, 40, 0.4);
      --logo-bg: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.4) 100%);
    }

    /* 彩虹色标单一来源：三处 SVG 渐变的 stop 经类引用 :root 的 --rw-* 变量 */
    .rw-1 { stop-color: var(--rw-1); }
    .rw-2 { stop-color: var(--rw-2); }
    .rw-3 { stop-color: var(--rw-3); }
    .rw-4 { stop-color: var(--rw-4); }
    .rw-5 { stop-color: var(--rw-5); }
    .rw-6 { stop-color: var(--rw-6); }
    .rw-7 { stop-color: var(--rw-7); }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-obsidian);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--text-primary);
    }

    #player-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-obsidian);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    #player-container.drag-over::after {
      content: '';
      position: absolute;
      inset: 8px;
      border: 2px dashed var(--accent-neon);
      border-radius: var(--r-lg);
      pointer-events: none;
      z-index: 50;
    }

    /* 顶部轻提示 Toast */
    #global-toast {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-raised);
      color: var(--text-primary);
      padding: 8px 20px;
      border-radius: var(--r-full);
      font-size: 13px;
      font-weight: 500;
      z-index: 40;
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow-toast);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #global-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(4px);
    }

    /* 视频播放核心 - 支持比例拉伸与无边框贴合 */
    #main-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000;
    }

    /* 纯音频音乐播放效果层 - 盖住无画面的 video，位于字幕层(15)之下、控制栏(20)之下。
     设计：封面主色环境光（每首歌背景随封面变化），居中垂直排版，频谱沉底。 */
    #music-visualizer {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none; /* JS 在音乐模式下切换为 flex */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--music-bg);
      overflow: hidden;
      pointer-events: none;
      transition: background 0.7s ease;
    }

    /* 封面卡片：大圆角 + 环境光晕（色值由 JS 从封面采样写入 --cover-glow） */
    .music-cover-frame {
      width: min(34vh, 280px);
      height: min(34vh, 280px);
      border-radius: 22px;
      box-shadow:
        0 26px 70px var(--shadow-cover),
        0 0 90px var(--cover-glow, rgba(64, 128, 255, 0.2)),
        0 0 0 1px var(--cover-ring);
      background: var(--cover-frame);
      overflow: hidden;
      flex-shrink: 0;
    }

    #music-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; /* 找到封面时 JS 置 block */
    }

    #music-cover-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,
        rgba(255, 59, 78, 0.14) 0%, rgba(255, 212, 0, 0.14) 25%,
        rgba(46, 204, 91, 0.14) 50%, rgba(0, 194, 255, 0.14) 75%,
        rgba(162, 75, 255, 0.14) 100%);
      color: var(--cover-fallback);
    }
    #music-cover-fallback svg {
      width: 92px;
      height: 92px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #music-title {
      max-width: 82%;
      margin: 28px 0 0;
      font-size: clamp(20px, 3.2vh, 30px);
      font-weight: 650;
      letter-spacing: 0.5px;
      color: var(--music-title);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: var(--music-title-shadow);
    }

    /* 元信息行：格式 · 时长（由 JS 填充） */
    .music-meta {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.6px;
      color: var(--music-meta);
      text-transform: uppercase;
    }

    /* 频谱沉底横贯，细柱克制 */
    #music-spectrum {
      position: absolute;
      bottom: 7%;
      left: 50%;
      transform: translateX(-50%);
      width: min(64%, 720px);
      height: 64px;
      opacity: 0.92;
    }

    /* 外挂字幕显示区（bottom 为静态值，无位移逻辑，不需要过渡动画） */
    #custom-subtitle-overlay {
      position: absolute;
      bottom: 90px;
      left: 5%;
      width: 90%;
      text-align: center;
      pointer-events: none;
      z-index: 15;
    }

    #custom-subtitle-text {
      display: inline-block;
      background: var(--subtitle-bg);
      color: var(--subtitle-text);
      padding: 8px 20px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.4;
      text-shadow: var(--subtitle-shadow);
      word-wrap: break-word;
      white-space: pre-line;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.1);
    }

    /* 空状态 - 黑曜石晶质感视觉 */
    #empty-state {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      color: var(--text-secondary);
      pointer-events: auto;
      text-align: center;
      padding: 40px;
      -webkit-app-region: drag;
    }

    #empty-state .empty-actions {
      -webkit-app-region: no-drag;
    }

    #empty-state .brand-logo-container .logo-blob {
      fill: var(--empty-logo-fill);
      stroke: var(--empty-logo-stroke);
    }

    #empty-state .brand-logo-container {
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--logo-bg);
      border: 1px solid var(--panel-border);
      border-radius: 26px;
      box-shadow: var(--logo-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
    }

    #empty-state:hover .brand-logo-container {
      transform: translateY(-4px);
      border-color: var(--panel-border-glow);
    }

    #empty-state h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    #empty-state p {
      font-size: 14px;
      margin-bottom: 28px;
      color: var(--text-secondary);
    }

    .empty-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #040810;
      border: none;
      padding: 11px 26px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: var(--ghost-bg);
      color: var(--text-primary);
      border: 1px solid var(--panel-border);
      padding: 11px 26px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn-ghost:hover {
      background: var(--ghost-hover);
      border-color: var(--ghost-hover-border);
      transform: translateY(-1px);
    }

    /* 自定义沉浸式无边框标题栏（全透明通栏：无毛玻璃底色，仅文字与按键；清晰度由字影/图标投影保障）。
       颜色对齐契约：文字/按键/悬停/投影全部取自主题变量（--text-*、--win-*、--titlebar-*），
       与底部功能栏共用同一套深浅色板——切换主题时顶部随之同步变色，不允许出现写死的主题色 */
    #titlebar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 42px;
      background: transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px 0 18px;
      z-index: 20;
      /* 不使用 OS 级拖拽区：app-region:drag 会吞掉鼠标事件（悬停/停放时热区唤出与
         保持显示失效）；窗口拖拽由 renderer.js 用 pointer 事件自行实现，事件全程可达 */
      -webkit-app-region: no-drag;
      transition: opacity 0.12s ease-out; /* 近瞬时过渡：跟随鼠标弹出/收起，无"慢半拍"感 */
      opacity: 1;
    }

    #titlebar.hide {
      opacity: 0;
      pointer-events: none;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 65%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: var(--titlebar-shadow); /* 透明底上保证文字在任意画面背景下可读 */
    }

    .title-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: var(--text-primary);
    }

    .title-logo svg {
      width: 16px;
      height: 16px;
    }

    #video-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-primary);
      font-weight: 400;
      opacity: 0.85;
    }

    /* 窗口控制按钮组：贴住窗口右上角的原生式按键（非悬浮）。
       44×42 矩形热区一直延伸到窗口边缘，视觉上属于窗口框架本身 */
    .window-controls {
      display: flex;
      height: 42px;
      margin-right: -14px; /* 抵消标题栏右侧内边距，按键贴住窗口角 */
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 44px;
      height: 42px;
      border-radius: 0;
      border: none;
      background: transparent;
      /* 与左侧 BBPLAYER 字样同色（--text-primary）：深色主题即纯白，避免灰图标看不清 */
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .win-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .win-btn:hover {
      background: var(--win-hover);
      color: var(--text-primary);
    }

    .win-btn.close:hover {
      background: #e81123;
      color: #ffffff;
    }

    /* 现代无边框悬浮胶囊控制面板 (Floating Glass Dock) */
    #controls-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 900px;
      padding: 12px 18px;
      background: var(--dock-glass);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--bar-border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-bar);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-app-region: no-drag;
    }

    #controls-overlay.hide {
      opacity: 0;
      transform: translate(-50%, 16px);
      pointer-events: none;
    }

    /* 精准极细悬浮进度条 */
    #progress-container {
      position: relative;
      width: 100%;
      height: 4px;
      background: var(--track-bg);
      border-radius: 2px;
      cursor: pointer;
      transition: height 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #progress-container:hover {
      height: 8px;
      border-radius: 4px;
    }

    /* 彩虹进度条：填充层恒为全宽彩虹渐变，用 --progress 变量经 clip-path 裁剪。
       这样色带位置固定不随进度压缩变形（若把渐变设在变宽的填充层上，颜色会被压缩） */
    #progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 100%;
      background: var(--rainbow-gradient);
      clip-path: inset(0 calc(100% - var(--progress, 0%)) 0 0 round 4px);
      border-radius: 4px;
      transition: clip-path 0.05s linear;
    }

    #progress-handle {
      position: absolute;
      left: var(--progress, 0%);
      top: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: var(--handle-bg);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #progress-container:hover #progress-handle {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
    }

    .ctrl-btn svg {

      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;

    .ctrl-btn:hover {
      background: var(--ctrl-hover-bg);
      color: var(--text-primary);

    .ctrl-btn.active {
      color: var(--accent-text);
      background: transparent;
    }

    /* 播放键：透明底色，播放/暂停图标本身呈彩虹渐变（与应用图标同语言）。

    #btn-play {
      width: 40px;
      height: 40px;
      border-radius: var(--r-md);
      background: transparent;
      color: var(--text-primary);

    #btn-play:active {

      width: 24px;
      height: 24px;
      fill: currentColor;
      stroke: none;

    #btn-play .svg-defs {

      height: 0;

      bottom: 42px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface-raised);
      border: 1px solid var(--panel-border);
      border-radius: var(--r-md);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 30;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      min-width: 110px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .popover-menu.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .menu-item {
      position: relative;
      padding: 7px 14px 7px 30px;
      font-size: 12px;
      color: var(--text-secondary);
      border-radius: var(--r-sm);
      cursor: pointer;
      text-align: left;
      transition: color 0.15s ease, background-color 0.15s ease;
      white-space: nowrap;
    }

    /* 选中态指示点：所有条目占位、仅激活项着色，保证文字左对齐 */
    .menu-item::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 50%;
      width: 5px;
      height: 5px;
      margin-top: -2.5px;
      border-radius: 50%;

    }

      padding: 9px 10px;

      color: var(--text-secondary);

      transition: color 0.15s ease, background-color 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
    }

    .playlist-item:hover {
      background: var(--item-hover);
      color: var(--text-primary);
    }

    /* 正在播放：左缘强调条 + 标题着色（替代整行染色） */
    .playlist-item.active {
      background: transparent;
      color: var(--accent-text);
      font-weight: 500;
    }

    .playlist-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 9px;
      bottom: 9px;
      width: 3px;
      border-radius: 2px;
      background: var(--accent-text);
    }

    /* 序号列：等宽两位数；正在播放的条目换成三根跳动小均衡器 */
    .item-index {
      width: 26px;
      flex-shrink: 0;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 序号与均衡器双列共存，由 active 状态切换可见性
      （playPlaylistItem 的轻量高亮路径只改 class 不重建 DOM，两份 DOM 都必须在场） */
    .playlist-item .eq-indicator {
      display: none;
    }

    .playlist-item.active .eq-indicator {
      display: flex;
    }

    .playlist-item.active .item-index {
      display: none;
    }

    .eq-indicator {
      width: 26px;
      height: 14px;
      flex-shrink: 0;
      align-items: flex-end;
      gap: 2.5px;
    }

    .eq-indicator i {
      width: 3px;
      border-radius: 1px;
      background: var(--accent-text);
      transform-origin: bottom;
      animation: eq-bounce 1s ease-in-out infinite;
    }

    .eq-indicator i:nth-child(1) { height: 8px; }
    .eq-indicator i:nth-child(2) { height: 13px; animation-delay: 0.15s; }
    .eq-indicator i:nth-child(3) { height: 10px; animation-delay: 0.3s; }

    /* 暂停时均衡器同步静止（由 JS 切换 is-paused） */
    .playlist-items.is-paused .eq-indicator i {
      animation-play-state: paused;
    }

    @keyframes eq-bounce {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    .playlist-item .item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .playlist-item .item-time {
      margin-left: 8px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
      white-space: nowrap;
    }

    .playlist-item .remove-btn,
    .playlist-item .new-win-btn {
      margin-left: 6px;
      opacity: 0;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .playlist-item .remove-btn svg,
    .playlist-item .new-win-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .playlist-item:hover .remove-btn,
    .playlist-item:hover .new-win-btn {
      opacity: 1;
    }

    .playlist-item .remove-btn:hover {
      color: #ff4d4f;
    }

    .playlist-item .new-win-btn:hover {
      color: var(--accent-text);
    }

    .playlist-empty {
      padding: 60px 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* 键盘可达性：仅键盘导航时显示焦点环 */
    button:focus-visible,
    .menu-item:focus-visible,
    .resume-btn:focus-visible {
      outline: 2px solid var(--accent-text);
      outline-offset: 2px;
    }

    button:focus:not(:focus-visible) {
      outline: none;
    }

    /* 尊重系统"减少动态效果"偏好 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
