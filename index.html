<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' file: blob:; img-src 'self' data: blob:;">
  <title>BB 极简无边框视频播放器</title>
  <style>
    :root {
      --bg-obsidian: #08090c;
      --panel-glass: rgba(14, 17, 23, 0.75);
      --panel-glass-hover: rgba(22, 27, 36, 0.85);
      --panel-border: rgba(255, 255, 255, 0.08);
      --panel-border-glow: rgba(0, 242, 254, 0.25);
      --accent-neon: #00f2fe;
      --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --accent-glow: rgba(0, 242, 254, 0.4);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-obsidian);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--text-primary);
    }

    #player-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-obsidian);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #player-container.drag-over::after {
      content: '';
      position: absolute;
      inset: 8px;
      border: 2px dashed var(--accent-neon);
      border-radius: 16px;
      pointer-events: none;
      z-index: 50;
      box-shadow: inset 0 0 30px var(--accent-glow);
    }

    /* 顶部轻提示 Toast */
    #global-toast {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-glass);
      backdrop-filter: blur(20px) saturate(180%);
      color: var(--text-primary);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 40;
      border: 1px solid var(--panel-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #global-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(4px);
    }

    /* 视频播放核心 - 支持比例拉伸 */
    #main-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000;
    }

    /* 外挂字幕显示区 */
    #custom-subtitle-overlay {
      position: absolute;
      bottom: 90px;
      left: 5%;
      width: 90%;
      text-align: center;
      pointer-events: none;
      z-index: 15;
      transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #custom-subtitle-text {
      display: inline-block;
      background: rgba(8, 9, 12, 0.82);
      backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.4;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      word-wrap: break-word;
      white-space: pre-line;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.1);
    }

    /* 空状态 - 黑曜石晶质感视觉 */
    #empty-state {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      color: var(--text-secondary);
      pointer-events: auto;
      text-align: center;
      padding: 40px;
    }

    #empty-state .brand-logo-container {
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid var(--panel-border);
      border-radius: 26px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
    }

    #empty-state:hover .brand-logo-container {
      transform: translateY(-4px);
      border-color: var(--panel-border-glow);
    }

    #empty-state h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    #empty-state p {
      font-size: 14px;
      margin-bottom: 28px;
      color: var(--text-secondary);
    }

    .empty-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #040810;
      border: none;
      padding: 11px 26px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0, 242, 254, 0.6);
      filter: brightness(1.1);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      border: 1px solid var(--panel-border);
      padding: 11px 26px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    /* 自定义沉浸式无边框标题栏 */
    #titlebar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 42px;
      background: linear-gradient(to bottom, rgba(8, 9, 12, 0.85) 0%, rgba(8, 9, 12, 0) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px 0 18px;
      z-index: 20;
      -webkit-app-region: drag;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 1;
    }

    #titlebar.hide {
      opacity: 0;
      pointer-events: none;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 65%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .title-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: var(--text-primary);
    }

    .title-logo svg {
      width: 16px;
      height: 16px;
    }

    #video-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-primary);
      font-weight: 400;
      opacity: 0.85;
    }

    /* 现代性感窗口控制按钮组 */
    .window-controls {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .win-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
    }

    .win-btn.close:hover {
      background: rgba(255, 77, 79, 0.85);
      border-color: rgba(255, 77, 79, 0.9);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 77, 79, 0.4);
    }

    /* 现代无边框悬浮胶囊控制面板 (Floating Glass Dock) */
    #controls-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 900px;
      padding: 14px 20px;
      background: var(--panel-glass);
      backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #controls-overlay.hide {
      opacity: 0;
      transform: translate(-50%, 16px);
      pointer-events: none;
    }

    /* 精准极细悬浮进度条 */
    #progress-container {
      position: relative;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      cursor: pointer;
      transition: height 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #progress-container:hover {
      height: 8px;
      border-radius: 4px;
    }

    #progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      border-radius: 4px;
      transition: width 0.05s linear;
    }

    #progress-handle {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-neon);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #progress-container:hover #progress-handle {
      opacity: 1;
      transform: translateY(-50%) scale(1.1);
    }

    /* 时间 Hover 气泡提示 */
    #progress-tooltip {
      position: absolute;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(8, 9, 12, 0.92);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      display: none;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid var(--panel-border);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    /* 播放功能栏按钮组 */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0;
    }

    .ctrl-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ctrl-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.08);
      transform: scale(1.05);
    }

    .ctrl-btn.active {
      color: var(--accent-neon);
      background: rgba(0, 242, 254, 0.12);
    }

    /* 文字类型控制按钮（倍速/比例/字幕） */
    .ctrl-btn.text-btn {
      width: auto;
      padding: 0 8px;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .time-display {
      font-size: 12px;
      color: var(--text-secondary);
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      margin-left: 4px;
      letter-spacing: 0.5px;
    }

    /* 音量调控弹窗 */
    .volume-container {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-slider-wrapper {
      width: 64px;
      display: flex;
      align-items: center;
    }

    #volume-range {
      width: 100%;
      height: 4px;
      accent-color: var(--accent-neon);
      cursor: pointer;
      border-radius: 2px;
    }

    /* 浮动下拉菜单组件 (倍速、字幕、画面比例) */
    .menu-popover-container {
      position: relative;
    }

    .popover-menu {
      position: absolute;
      bottom: 42px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(14, 17, 23, 0.92);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 30;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(20px) saturate(180%);
      min-width: 100px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .popover-menu.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .menu-item {
      padding: 7px 14px;
      font-size: 12px;
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .menu-item.active {
      background: rgba(0, 242, 254, 0.15);
      color: var(--accent-neon);
      font-weight: 600;
    }

    /* 上次播放记忆续播提示条 */
    #resume-toast {
      position: absolute;
      bottom: 96px;
      left: 28px;
      background: var(--panel-glass);
      border: 1px solid var(--panel-border-glow);
      padding: 10px 18px;
      border-radius: 20px;
      display: none;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      z-index: 25;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
      backdrop-filter: blur(20px);
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .resume-btn {
      color: var(--accent-neon);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    .resume-close {
      cursor: pointer;
      opacity: 0.6;
      font-size: 12px;
      transition: opacity 0.2s;
    }
    .resume-close:hover { opacity: 1; }

    /* 右侧抽屉式播放列表面板 */
    #playlist-panel {
      position: absolute;
      top: 42px;
      right: -300px;
      width: 300px;
      height: calc(100vh - 42px);
      background: var(--panel-glass);
      backdrop-filter: blur(24px) saturate(180%);
      border-left: 1px solid var(--panel-border);
      z-index: 18;
      display: flex;
      flex-direction: column;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -10px 0 30px rgba(0,0,0,0.6);
    }

    #playlist-panel.open {
      right: 0;
    }

    .playlist-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
    }

    .playlist-header h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .playlist-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .playlist-count {
      font-size: 12px;
      color: var(--accent-neon);
      font-weight: 500;
    }

    .ctrl-btn.small {
      width: 26px;
      height: 26px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .ctrl-btn.small svg {
      width: 14px;
      height: 14px;
    }

    .playlist-items {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .playlist-item {
      padding: 10px 20px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    .playlist-item.active {
      background: rgba(0, 242, 254, 0.12);
      color: var(--accent-neon);
      font-weight: 500;
    }

    .playlist-item .item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .playlist-item .item-time {
      margin-left: 8px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
      white-space: nowrap;
    }

    .playlist-item .remove-btn {
      margin-left: 8px;
      opacity: 0;
      font-size: 12px;
      color: var(--text-muted);
      transition: opacity 0.2s, color 0.2s;
    }

    .playlist-item:hover .remove-btn {
      opacity: 1;
    }

    .playlist-item .remove-btn:hover {
      color: #ff4d4f;
    }

    .playlist-empty {
      padding: 60px 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div id="player-container">
    <!-- 无边框自定义标题栏 -->
    <div id="titlebar">
      <div class="title-area">
        <span class="title-logo">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#logoGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="logoGlow" x1="0" y1="0" x2="24" y2="24">
                <stop offset="0%" stop-color="#00f2fe"/>
                <stop offset="100%" stop-color="#4facfe"/>
              </linearGradient>
            </defs>
          </svg>
          BBPLAYER
        </span>
        <span id="video-title">极简本地视频播放器</span>
      </div>
      <!-- 现代极简窗口控制组 -->
      <div class="window-controls">
        <button class="win-btn" id="btn-minimize" title="最小化">
          <svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg>
        </button>
        <button class="win-btn" id="btn-maximize" title="最大化/还原">
          <svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5"/></svg>
        </button>
        <button class="win-btn close" id="btn-close" title="关闭">
          <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
        </button>
      </div>
    </div>

    <!-- 视频渲染 DOM -->
    <video id="main-video"></video>

    <!-- 自定义外挂字幕渲染区 -->
    <div id="custom-subtitle-overlay">
      <span id="custom-subtitle-text" style="display: none;"></span>
    </div>

    <!-- 空状态 - 黑曜透镜晶体视觉 -->
    <div id="empty-state">
      <div class="brand-logo-container">
        <svg width="48" height="48" viewBox="0 0 512 512" fill="none">
          <defs>
            <linearGradient id="emptyNeon" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00F2FE"/>
              <stop offset="100%" stop-color="#4FACFE"/>
            </linearGradient>
          </defs>
          <path d="M180 140 C180 140, 290 140, 340 190 C380 230, 360 280, 310 300 C370 320, 380 380, 320 420 C270 450, 180 450, 180 450 Z" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="6"/>
          <path d="M210 170 L340 256 L210 342 Z" fill="url(#emptyNeon)" rx="8"/>
        </svg>
      </div>
      <h2>享受沉浸式无边框影音</h2>
      <p>拖拽本地视频文件到此处，或点击下方按钮选择</p>
      <div class="empty-actions">
        <button class="btn-primary" id="btn-open-file">选择本地视频</button>
        <button class="btn-ghost" id="btn-open-folder">打开文件夹</button>
      </div>
    </div>

    <!-- 上次播放记忆续播提示条 -->
    <div id="resume-toast">
      <span>检测到您上次看到 <b id="resume-time-str">00:00</b></span>
      <span class="resume-btn" id="btn-do-resume">跳转续播</span>
      <span class="resume-close" id="btn-dismiss-resume">✕</span>
    </div>

    <!-- 右侧播放列表抽屉面板 -->
    <div id="playlist-panel">
      <div class="playlist-header">
        <h3>播放列表</h3>
        <div class="playlist-actions">
          <span class="playlist-count" id="playlist-count">0 个视频</span>
          <button class="ctrl-btn small" id="btn-add-folder" title="添加文件夹中的视频">
            <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="ctrl-btn small" id="btn-history-view" title="观看历史记录">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </button>
          <button class="ctrl-btn small" id="btn-playlist-clear" title="清空播放列表">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
      <div class="playlist-items" id="playlist-items">
        <div class="playlist-empty">暂无播放视频<br>拖拽多个视频到此处添加</div>
      </div>
    </div>

    <!-- 顶部消息 Toast -->
    <div id="global-toast"></div>

    <!-- 悬浮胶囊控制面板 (Floating Glass Dock) -->
    <div id="controls-overlay">
      <!-- 时间精准 Seek 进度条 -->
      <div id="progress-container">
        <div id="progress-fill">
          <div id="progress-handle"></div>
        </div>
        <div id="progress-tooltip">00:00</div>
      </div>

      <!-- 控制按键栏 -->
      <div class="controls-row">
        <div class="controls-left">
          <button class="ctrl-btn" id="btn-prev" title="上一个视频">
            <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
          </button>
          <button class="ctrl-btn" id="btn-play" title="播放/暂停 (Space)">
            <svg viewBox="0 0 24 24" id="icon-play-state"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <button class="ctrl-btn" id="btn-next" title="下一个视频">
            <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>
          <div class="time-display">
            <span id="current-time">00:00</span> / <span id="duration-time">00:00</span>
          </div>
        </div>

        <div class="controls-right">
          <!-- 播放模式控制菜单 -->
          <div class="menu-popover-container">
            <button class="ctrl-btn" id="btn-play-mode" title="播放模式">
              <svg viewBox="0 0 24 24" id="icon-play-mode-state">
                <g id="icon-playmode-state">
                  <!-- 默认全部循环模式图标 -->
                  <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </g>
              </svg>
            </button>
            <div class="popover-menu" id="play-mode-menu">
              <div class="menu-item" data-mode="list-loop">全部视频循环</div>
              <div class="menu-item" data-mode="random">全部视频随机</div>
              <div class="menu-item" data-mode="single-loop">单个视频循环</div>
            </div>
          </div>

          <!-- 高清截图按键 -->
          <button class="ctrl-btn" id="btn-screenshot" title="画面高清截图 (S)">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </button>

          <!-- 顺时针旋转视频 90° -->
          <button class="ctrl-btn" id="btn-rotate" title="顺时针旋转 90°">
            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>

          <!-- 外挂字幕控制 -->
          <div class="menu-popover-container">
            <button class="ctrl-btn text-btn" id="btn-subtitle" title="外挂字幕 (CC)">CC</button>
            <div class="popover-menu" id="subtitle-menu">
              <div class="menu-item" id="btn-load-sub">加载字幕文件...</div>
              <div class="menu-item" id="btn-toggle-sub">隐藏字幕</div>
              <div class="menu-item" id="btn-sub-size-up">字号 +</div>
              <div class="menu-item" id="btn-sub-size-down">字号 -</div>
              <div class="menu-item" id="btn-sub-offset-up">字幕延后 0.5s</div>
              <div class="menu-item" id="btn-sub-offset-down">字幕提前 0.5s</div>
            </div>
          </div>

          <!-- 画面比例控制 -->
          <div class="menu-popover-container">
            <button class="ctrl-btn text-btn" id="btn-aspect" title="画面比例">16:9</button>
            <div class="popover-menu" id="aspect-menu">
              <div class="menu-item active" data-aspect="auto">自动比例</div>
              <div class="menu-item" data-aspect="16-9">16 : 9</div>
              <div class="menu-item" data-aspect="4-3">4 : 3</div>
              <div class="menu-item" data-aspect="cover">拉伸铺满</div>
            </div>
          </div>

          <!-- 倍速选择菜单 -->
          <div class="menu-popover-container">
            <button class="ctrl-btn text-btn" id="btn-speed" title="倍速播放">1.0x</button>
            <div class="popover-menu" id="speed-menu">
              <div class="menu-item" data-speed="3.0">3.0x</div>
              <div class="menu-item" data-speed="2.0">2.0x</div>
              <div class="menu-item" data-speed="1.5">1.5x</div>
              <div class="menu-item" data-speed="1.25">1.25x</div>
              <div class="menu-item active" data-speed="1.0">1.0x</div>
              <div class="menu-item" data-speed="0.75">0.75x</div>
              <div class="menu-item" data-speed="0.5">0.5x</div>
            </div>
          </div>

          <!-- 音量调控 -->
          <div class="volume-container">
            <button class="ctrl-btn" id="btn-volume" title="音量/静音">
              <svg viewBox="0 0 24 24" id="icon-volume-state"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
            <div class="volume-slider-wrapper">
              <input type="range" id="volume-range" min="0" max="1" step="0.05" value="1">
            </div>
          </div>

          <!-- 全屏切换 -->
          <button class="ctrl-btn" id="btn-fullscreen" title="全屏 (F11)">
            <svg viewBox="0 0 24 24" id="icon-fullscreen-state"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>

          <!-- 播放列表切换按钮 -->
          <button class="ctrl-btn" id="btn-playlist" title="播放列表">
            <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
