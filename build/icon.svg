<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 暗夜钛金黑曜石背景渐变 -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A2234"/>
      <stop offset="60%" stop-color="#0E121A"/>
      <stop offset="100%" stop-color="#06080C"/>
    </radialGradient>
    
    <!-- 冰核霓虹渐变 -->
    <linearGradient id="neonCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- 边框微光渐变 -->
    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,242,254,0.3)"/>
    </linearGradient>

    <!-- 霓虹发光滤镜 -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>
  </defs>

  <!-- 1. 底层冰蓝环境微光 (Ambient Glow) -->
  <circle cx="256" cy="256" r="160" fill="#00F2FE" opacity="0.15" filter="url(#ambientGlow)"/>

  <!-- 2. 主体 Squircle 超椭圆面板 -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#bgGlow)"/>
  <rect x="48" y="48" width="416" height="416" rx="96" stroke="url(#borderShimmer)" stroke-width="2"/>

  <!-- 3. 双曲面弧线 (抽象 B 质感) -->
  <path d="M170 140 C280 140, 360 190, 360 256 C360 322, 280 372, 170 372" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M170 180 C250 180, 310 215, 310 256 C310 297, 250 332, 170 332" stroke="rgba(0, 242, 254, 0.12)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 4. 核心 Play 按钮 (冰核发光) -->
  <path d="M205 160 C205 153.5, 212.3 149.5, 217.8 153.2 L345.8 249.2 C350.8 252.9, 350.8 260.1, 345.8 263.8 L217.8 359.8 C212.3 363.5, 205 359.5, 205 353 L205 160 Z" 
        fill="url(#neonCore)" 
        filter="url(#neonBlur)"/>

  <!-- 顶角白亮高光点 -->
  <circle cx="346" cy="256" r="3" fill="#FFFFFF" opacity="0.9"/>
</svg>
