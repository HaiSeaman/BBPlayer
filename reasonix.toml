[permissions]
allow = ["Bash=node -e \"\nconst fs = require('fs');\nlet html = fs.readFileSync('index.html', 'utf8');\nconst stub = \\`<script>\nwindow.electronAPI = {\n  getInitialFile: () => Promise.resolve(null),\n  onOpenFile: () => {},\n  onWindowMinimized: () => {},\n  onWindowRestored: () => {}\n};\n</script>\\`;\nhtml = html.replace('<head>', '<head>' + stub);\nfs.writeFileSync('_hover_test.html', html);\nconsole.log('临时测试页已生成');\n\"", "Bash=node -e \"try{console.log('puppeteer', require('puppeteer/package.json').version)}catch(e){console.log('no puppeteer')}; try{console.log('playwright', require('playwright/package.json').version)}catch(e){console.log('no playwright')}\"", "Bash=REALTMP=$(cygpath -w \"$TEMP\" 2>/dev/null || echo \"$TEMP\"); echo \"TEMP=$REALTMP\"; mkdir -p \"$TEMP/bbplayer-hover-test\" && mv '${TEMP}/bbplayer-hover-test/test.js' \"$TEMP/bbplayer-hover-test/test.js\" && rm -rf '${TEMP}' && ls \"$TEMP/bbplayer-hover-test\""]
